<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-менеджер агентства - демо AweLabs</title>
<meta name="description" content="Демо ИИ-менеджера для агентства недвижимости: справочная по объектам, витрина в Telegram, автообновление цен, модерация группы и поиск.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='19.5' y='8' width='6.5' height='16' rx='1' fill='%2300ff41'/%3E%3Ctext x='5' y='23' font-size='16' font-family='monospace' fill='%23e8f0e8'%3Ea%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg2:#0d120e;--bg3:#121a14;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#e8f0e8;--muted:#7a857c;
  --g:#00ff41;--g2:#00b82e;--g3:#003b0f;
  --head:'Manrope','Noto Sans Thai',sans-serif;
  --mono:'JetBrains Mono','Noto Sans Thai',monospace;
  /* telegram dark */
  --tg:#0e1621;--tgh:#17212b;--tgin:#182533;--tgout:#2b5278;--tgt:#f5f5f5;--tgm:#6d7f8f;--tga:#6ab2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--head);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hr{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font:800 21px var(--mono);letter-spacing:-.02em;display:flex;align-items:center}
.logo .u{color:var(--g)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--g);margin-left:4px;box-shadow:0 0 12px rgba(0,255,65,.55);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hrr{display:flex;align-items:center;gap:14px}
.by{font:500 13px var(--mono);color:var(--muted)}.by b{color:var(--text)}
.lang{display:flex;border:1px solid var(--line2);border-radius:30px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:700 12px var(--mono);padding:7px 11px;cursor:pointer}
.lang button.on{background:var(--g);color:var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.hero{position:relative;padding:90px 0 60px;overflow:hidden}
.hero .orb{width:600px;height:600px;background:var(--g);opacity:.08;top:-260px;right:-180px}
.k{font:500 13px var(--mono);color:var(--g);letter-spacing:.02em}
h1{font:800 clamp(36px,5.4vw,64px)/1.04 var(--head);letter-spacing:-.035em;margin:18px 0 20px;max-width:820px;position:relative}
h1 em{font-style:normal;color:var(--g)}
:lang(th) h1,:lang(th) h2{line-height:1.3;letter-spacing:0}
.lead{font-size:19px;color:#b9c4ba;max-width:700px;position:relative}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font:700 15px var(--head);border:1px solid var(--line2);cursor:pointer;background:none;color:var(--text)}
.btn.p{background:var(--g);color:var(--bg);border-color:var(--g);box-shadow:0 8px 30px rgba(0,255,65,.2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:56px;position:relative}
.stat{background:var(--bg2);padding:22px}
.stat b{display:block;font:800 30px var(--head);color:var(--g);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
section.f{padding:80px 0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 400px;gap:64px;align-items:center}
.row.r{grid-template-columns:400px 1fr}
.row.r .txt{order:2}
h2{font:800 clamp(28px,3.4vw,40px)/1.1 var(--head);letter-spacing:-.03em;margin:12px 0 16px}
.txt p{color:#b9c4ba;font-size:16px;margin-bottom:16px}
.pts{list-style:none;display:grid;gap:10px;margin-top:6px}
.pts li{position:relative;padding-left:22px;color:#c9d3ca;font-size:15px}
.pts li:before{content:'>';position:absolute;left:0;color:var(--g);font-family:var(--mono)}
.replay{margin-top:22px;font:600 13px var(--mono);color:var(--g);background:none;border:1px solid var(--g3);border-radius:8px;padding:8px 14px;cursor:pointer}
/* phone */
.ph{width:100%;max-width:400px;height:640px;border-radius:34px;border:1px solid var(--line2);background:var(--tg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px #121417;position:relative;font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans Thai',sans-serif}
.tgh{background:var(--tgh);padding:12px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #0b1118}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 15px var(--head);color:#fff}
.av.ai{background:linear-gradient(135deg,#00b82e,#004d14)}
.av.gr{background:linear-gradient(135deg,#3a7bd5,#1b3f73)}
.tgh b{font-size:15px;color:var(--tgt);display:block;line-height:1.2}
.tgh small{font-size:12.5px;color:var(--tgm)}
.tgh small.on{color:var(--tga)}
.body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;background:var(--tg) radial-gradient(circle at 20% 10%,rgba(106,178,242,.05),transparent 60%)}
.body::-webkit-scrollbar{display:none}
.m{max-width:84%;padding:7px 10px 6px;border-radius:14px;font-size:14px;line-height:1.38;color:var(--tgt);white-space:pre-line;animation:pop .28s ease-out both;position:relative}
.m.in{background:var(--tgin);align-self:flex-start;border-bottom-left-radius:4px}
.m.out{background:var(--tgout);align-self:flex-end;border-bottom-right-radius:4px}
.m .who{display:block;font-size:12.5px;font-weight:600;color:var(--tga);margin-bottom:2px}
.m .who.g{color:#4fd67a}
.m .t{float:right;font-size:11px;color:rgba(255,255,255,.45);margin:6px 0 -2px 10px}
.m.sys{align-self:center;background:rgba(0,0,0,.35);font-size:12.5px;color:#c9d6e2;border-radius:12px;padding:5px 11px;max-width:92%;text-align:center}
.m.del{opacity:.55}
.m.del .tx{text-decoration:line-through}
.m.del:after{content:'🗑';position:absolute;right:-6px;top:-8px;font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;background:var(--tgin);border-radius:14px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tgm);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-2px)}}
.inp{background:var(--tgh);padding:10px 12px;display:flex;align-items:center;gap:10px;border-top:1px solid #0b1118}
.inp span{flex:1;background:#242f3d;border-radius:18px;padding:8px 14px;font-size:13.5px;color:var(--tgm)}
.inp i{width:34px;height:34px;border-radius:50%;background:var(--tga);flex:none}
/* topics */
.topic{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #0b1118;animation:pop .3s both}
.topic .ic{width:38px;height:38px;border-radius:50%;background:#20303f;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.topic b{font-size:14.5px;color:var(--tgt);font-weight:600;display:block}
.topic small{font-size:12.5px;color:var(--tgm)}
.topic .pin{margin-left:auto;font-size:12px;color:var(--tgm)}
/* listing post */
.post{background:var(--tgin);border-radius:14px;overflow:hidden;max-width:92%;align-self:flex-start;animation:pop .3s both}
.album{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:96px 96px;gap:2px}
.album div{position:relative;background-size:cover}
.album div:first-child{grid-row:span 2}
.album div:after{content:'awe';position:absolute;right:6px;bottom:4px;font:700 10px var(--mono);color:rgba(255,255,255,.28)}
.ph1{background:linear-gradient(160deg,#5a8fb8,#2d4d66 60%,#c9a26b)}
.ph2{background:linear-gradient(200deg,#d9c9a8,#8a6e4b)}
.ph3{background:linear-gradient(170deg,#3aa6b9,#1d5e6d 55%,#e6d7b3)}
.cap{padding:9px 11px 8px;font-size:13.5px;line-height:1.42;color:var(--tgt);white-space:pre-line}
.cap .sold{display:inline-block;font-weight:700;color:#5fe07f;margin-bottom:4px;animation:pop .4s both}
.price{transition:background .4s}
.price.hl{background:rgba(0,255,65,.18);border-radius:4px}
.ct{display:flex;gap:6px;padding:0 11px 10px;flex-wrap:wrap}
.ct span{font-size:12px;background:#22364a;color:var(--tga);padding:4px 9px;border-radius:12px}
/* crm card */
.crm{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-top:20px;font:13px var(--mono);max-width:520px}
.crm .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.crm .r:last-of-type{border:0}
.crm .r span{color:var(--muted)}
.crm .v{color:var(--text);transition:color .3s}
.crm .v.ch{color:var(--g)}
.crm .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.crm button{background:var(--g3);color:var(--g);border:1px solid rgba(0,255,65,.3);border-radius:8px;padding:8px 12px;font:600 12.5px var(--mono);cursor:pointer}
.crm button:disabled{opacity:.4;cursor:default}
.timer{font:600 12px var(--mono);color:var(--muted);margin-top:10px;min-height:18px}
/* results */
.res{background:#1d2a39;border-radius:10px;padding:8px 10px;margin-top:6px;display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center}
.res i{width:46px;height:46px;border-radius:8px;display:block}
.res b{font-size:13px;display:block;color:var(--tgt)}
.res small{font-size:11.5px;color:var(--tgm)}
.res small a{color:var(--tga)}
/* how */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.how div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px}
.how b{font:700 13px var(--mono);color:var(--g);display:block;margin-bottom:8px}
.how p{font-size:14px;color:#b9c4ba}
.fin{padding:100px 0;text-align:center;border-top:1px solid var(--line);position:relative;overflow:hidden}
.fin .orb{width:500px;height:500px;background:var(--g);opacity:.07;left:50%;top:40%;transform:translate(-50%,-50%)}
.fin h2 em,h2 em{font-style:normal;color:var(--g)}
.fin h2{font-size:clamp(32px,4.6vw,54px);position:relative}
.fin p{color:#b9c4ba;max-width:580px;margin:0 auto;position:relative}
.fin .btns{justify-content:center}
footer{border-top:1px solid var(--line);padding:26px 0;font:500 12.5px var(--mono);color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font:500 12.5px var(--mono);color:var(--muted);margin-top:14px}
@media(max-width:980px){.row,.row.r{grid-template-columns:minmax(0,1fr);gap:36px}.row.r .txt{order:0}.ph{margin:0 auto}.how{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.wrap{padding:0 16px}.by{display:none}.how{grid-template-columns:1fr}.ph{height:600px}.hero{padding-top:56px}}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.shot{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
.shot img{width:100%;height:420px;object-fit:cover;object-position:top;display:block;border-bottom:1px solid var(--line)}
.shot p{padding:12px 14px;font-size:13.5px;color:#b9c4ba}
.shot p b{display:block;color:var(--text);font-size:14.5px;margin-bottom:2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:980px){.shots{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.shots{grid-template-columns:1fr}.shot img{height:300px}}
.tgd{display:grid;grid-template-columns:330px 1fr;height:640px;margin-top:30px;border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:var(--tg);box-shadow:0 30px 80px rgba(0,0,0,.55);font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans Thai',sans-serif}
.tgl{background:var(--tgh);border-right:1px solid #0b1118;display:flex;flex-direction:column;min-height:0}
.tglh{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid #0b1118}
.tglh b{font-size:15px;color:var(--tgt);display:block;line-height:1.2}.tglh small{font-size:12.5px;color:var(--tgm)}
#tlist{overflow-y:auto;flex:1;scrollbar-width:thin}
.tsec{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--g);padding:12px 14px 6px;opacity:.85}
.ti{display:flex;gap:11px;align-items:center;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
.ti:hover{background:#202b36}
.ti.on{background:#2b5278;border-left-color:var(--g)}
.ti .ic{width:34px;height:34px;border-radius:50%;background:#20303f;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.ti.on .ic{background:#3a6a96}
.ti div{min-width:0;flex:1}
.ti b{display:block;font-size:14px;color:var(--tgt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti small{display:block;font-size:12px;color:var(--tgm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti.on small{color:#c6dcf0}
.ti .pn{font-size:11px;color:var(--tgm)}
.tgr{display:flex;flex-direction:column;min-width:0;min-height:0}
.tpin{background:var(--tgh);border-bottom:1px solid #0b1118;padding:7px 16px;font-size:12.5px;color:var(--tgt);border-left:3px solid var(--tga);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpin b{color:var(--tga);font-weight:600;display:block;font-size:12px}
#tbody{padding:16px 18px}
.who-card{align-self:center;background:rgba(0,0,0,.35);border-radius:12px;padding:8px 14px;font-size:12.5px;color:#c9d6e2;text-align:center;max-width:90%;animation:pop .3s both}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.flow div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.flow b{display:block;font:700 12.5px var(--mono);color:var(--g);margin-bottom:6px}
.flow p{font-size:14px;color:#b9c4ba}
.flow small{display:block;margin-top:8px;font:500 12px var(--mono);color:var(--muted)}
@media(max-width:980px){.tgd{grid-template-columns:1fr;height:auto}.tgl{max-height:360px}.tgr{height:560px}.flow{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.flow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap hr">
  <a class="logo" href="https://awelabs.io">awe<span class="u">_labs</span><span class="cur"></span></a>
  <div class="hrr"><a class="by" href="https://awelabs.io">← <b>awelabs.io</b></a>
  <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="th">TH</button></div></div>
</div></header>

<section class="hero"><div class="orb"></div><div class="wrap">
  <div class="k" data-i="kick"></div>
  <h1 data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>
  <div class="btns"><a class="btn p" href="https://t.me/awe_labs" target="_blank" rel="noopener"><span data-i="ask"></span> ↗</a><a class="btn" href="#struct" data-i="see"></a></div>
  <div class="stats">
    <div class="stat"><b>134</b><span data-i="st1"></span></div>
    <div class="stat"><b>1 323</b><span data-i="st2"></span></div>
    <div class="stat"><b>5 <small style="font-size:16px">min</small></b><span data-i="st3"></span></div>
    <div class="stat"><b>24/7</b><span data-i="st4"></span></div>
  </div>
  <p class="note" data-i="note"></p>
</div></section>

<!-- structure -->
<section class="f" id="struct"><div class="wrap">
  <div class="k">01 / group structure</div><h2 data-i="h_s"></h2><p class="lead" style="font-size:16px" data-i="p_s"></p>
  <div class="tgd">
    <div class="tgl">
      <div class="tglh"><div class="av gr">RE</div><div><b data-i="grname"></b><small data-i="grsub"></small></div></div>
      <div id="tlist"></div>
    </div>
    <div class="tgr">
      <div class="tgh"><div><b id="tname"></b><small id="tcount"></small></div></div>
      <div class="tpin" id="tpin"></div>
      <div class="body" id="tbody"></div>
      <div class="inp"><span data-i="anon"></span><i></i></div>
    </div>
  </div>
  <div class="flow" id="flow"></div>
</div></section>

<!-- real screenshots -->
<section class="f" id="real"><div class="wrap">
  <div class="k">02 / real telegram</div><h2 data-i="h_r"></h2><p class="lead" style="font-size:16px" data-i="p_r"></p>
  <div class="shots">
    <div class="shot"><img src="shots/showcase.jpg" alt="" loading="lazy"><p><b data-i="r1h"></b><span data-i="r1p"></span></p></div>
    <div class="shot"><img src="shots/bans.jpg" alt="" loading="lazy"><p><b data-i="r3h"></b><span data-i="r3p"></span></p></div>
    <div class="shot"><img src="shots/search.jpg" alt="" loading="lazy"><p><b data-i="r4h"></b><span data-i="r4p"></span></p></div>
  </div>
</div></section>
<div class="lb" id="lb"><img alt=""></div>

<!-- 1. CRM helpdesk -->
<section class="f" id="s1"><div class="wrap row">
  <div class="txt"><div class="k">03 / helpdesk</div><h2 data-i="h_1"></h2><p data-i="p_1"></p>
    <ul class="pts"><li data-i="l1a"></li><li data-i="l1b"></li><li data-i="l1c"></li></ul>
    <button class="replay" data-run="chat1">↻ <span data-i="replay"></span></button></div>
  <div class="ph"><div class="tgh"><div class="av ai">AI</div><div><b data-i="ainame"></b><small class="on" data-i="online"></small></div></div>
    <div class="body" id="chat1"></div><div class="inp"><span data-i="msg"></span><i></i></div></div>
</div></section>



<!-- 3. auto edit -->
<section class="f"><div class="wrap row">
  <div class="txt"><div class="k">04 / auto-update</div><h2 data-i="h_3"></h2><p data-i="p_3"></p>
    <div class="crm">
      <div class="r"><span data-i="c_obj"></span><b class="v" data-i="c_name"></b></div>
      <div class="r"><span data-i="c_price"></span><b class="v" id="cprice">$98 000</b></div>
      <div class="r"><span data-i="c_status"></span><b class="v" id="cstat"></b></div>
      <div class="acts"><button id="bPrice" data-i="b_price"></button><button id="bSold" data-i="b_sold"></button><button id="bReset" data-i="b_reset"></button></div>
      <div class="timer" id="ctimer"></div>
    </div></div>
  <div class="ph"><div class="tgh"><div class="av gr">RE</div><div><b data-i="topic3"></b><small data-i="grname"></small></div></div>
    <div class="body" id="post3"></div></div>
</div></section>

<!-- 4. moderation -->
<section class="f"><div class="wrap row r">
  <div class="ph"><div class="tgh"><div class="av gr">?</div><div><b data-i="qtopic"></b><small data-i="grname"></small></div></div>
    <div class="body" id="mod"></div></div>
